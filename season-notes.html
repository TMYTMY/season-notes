<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1322">
<title>Notes</title>
<style>
<style>/* =====================================================================
   SEASON NOTES — DESIGN TOKENS
   ---------------------------------------------------------------------
   Single source of truth. Every colour, type size, spacing step, radius
   and fixed dimension is a token here; component rules only consume
   var(--token). The mobile block overrides TOKENS, not components.

   COMPONENT MAP (for the design spec)
   .screen.on        screen panel          #scCreate #scRace #scResult #scSeason
   .hud                 top bar              .hud .right numeric readouts
   .brand               wordmark
   .eyebrow             tracked gold section label
   .card(.hi) surface panel
   .btn(.is-gold/.sel) action button, >=44px tap target on mobile
   .moment            decision column
   .scene               SVG scene frame      .cap .spd .sceneMsg
   .radio-inline        pit-wall radio quote
   .opts             decision list        .opts .btn, .risk chip
   .side                right column
   .stat                key / value row
   .rounds              8-round progress strip
   .rrow          classification row
   .srow          season calendar row
   .crow           championship row
   .tierBox            end-of-season contract panel
   ===================================================================== */
:root{
  /* ---------- COLOUR : surfaces ---------- */
  --bg:#05080f;
  --ink:#0d1322;
  --ink2:#080d18;
  --card:#121a2c;
  --card2:#0e1524;
  --card-lift:#182238;
  --sunken:#0a1220;
  --overlay:rgba(6,10,18,.88);
  --scene-1:#0c1524;
  --scene-2:#080d16;
  /* ---------- COLOUR : lines ---------- */
  --line:#1e2a40;
  --line2:#27354e;
  --line-soft:#182238;
  --line-faint:#162034;
  --line-rule:#233049;
  --line-hover:#3d5173;
  --line-track:#141d2e;
  /* ---------- COLOUR : text ---------- */
  --tx:#e8ecf4;
  --slate:#b9c0cc;
  --muted:#a8b0be;
  --faint:#5a6476;
  --ghost:#3f4b60;
  --cream:#f2efe6;
  --track-dim:#4a6488;
  /* ---------- COLOUR : accent ---------- */
  --gold:#f2c14e;
  --gold2:#d8a63a;
  --gold-bright:#f6cb63;
  --gold-mid:#e8b23c;
  --gold-line:#c9992f;
  --gold-ink:#2a1c05;
  --red:#d9533f;
  --green:#3fbf8b;
  --blue:#4ea0ff;
  --warn:#ff9b7a;
  /* ---------- COLOUR : tints / effects ---------- */
  --glow-gold:rgba(242,193,78,.05);
  --glow-blue:rgba(78,160,255,.06);
  --tint-hover:rgba(255,255,255,.03);
  --tint-panel:rgba(255,255,255,.02);
  --tint-gold-06:rgba(242,193,78,.06);
  --tint-gold-08:rgba(242,193,78,.08);
  --tint-gold-32:rgba(242,193,78,.32);
  --tint-gold-40:rgba(242,193,78,.40);
  --tint-gold-45:rgba(242,193,78,.45);
  --tint-gold-50:rgba(242,193,78,.50);
  --tint-gold-55:rgba(242,193,78,.55);
  --tint-gold-60:rgba(242,193,78,.60);
  --tint-gold-75:rgba(242,193,78,.75);
  --tint-red-05:rgba(217,83,63,.05);
  --tint-red-07:rgba(217,83,63,.07);
  --tint-red-10:rgba(217,83,63,.10);
  --tint-red-28:rgba(217,83,63,.28);
  --tint-red-40:rgba(217,83,63,.40);
  --tint-red-45:rgba(217,83,63,.45);
  --tint-red-55:rgba(217,83,63,.55);
  --tint-red-75:rgba(217,83,63,.75);
  --tint-green-28:rgba(63,191,139,.28);
  --tint-green-35:rgba(63,191,139,.35);
  --shadow-card:0 20px 50px -40px rgba(242,193,78,.7);
  --shadow-gold:0 0 14px rgba(242,193,78,.7);
  --shadow-text:0 1px 4px #05080f;
  /* ---------- TYPE : families ---------- */
  --ff-serif:Georgia,"Times New Roman","Noto Serif TC","Songti TC",serif;
  --ff-sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  --ff-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* ---------- TYPE : scale ---------- */
  --fs-9:9px;
  --fs-9-5:9.5px;
  --fs-10:10px;
  --fs-10-5:10.5px;
  --fs-11:11px;
  --fs-11-5:11.5px;
  --fs-12:12px;
  --fs-12-5:12.5px;
  --fs-13:13px;
  --fs-13-5:13.5px;
  --fs-14:14px;
  --fs-14-5:14.5px;
  --fs-15:15px;
  --fs-20:20px;
  --fs-24:24px;
  --fs-26:26px;
  --fs-29:29px;
  --fs-30:30px;
  --fs-28:28px;
  --fs-22:22px;
  --fs-16:16px;
  --fs-31:31px;
  --fs-52:52px;
  --fs-58:58px;
  --fs-96:96px;
  /* ---------- TYPE : rhythm ---------- */
  --lh-flat:.95;
  --lh-tight:1.15;
  --lh-snug:1.3;
  --lh-heading:1.35;
  --lh-ui:1.45;
  --lh-copy:1.55;
  --lh-body:1.8;
  --lh-prose:1.9;
  --lh-read:2;
  --lh-story:2.05;
  --ls-hero:-.01em;
  --ls-xl:.22em;
  --ls-lg:.2em;
  --ls-label:.18em;
  --ls-md:.16em;
  --ls-sm:.14em;
  --ls-xs:.12em;
  --ls-2xs:.1em;
  --ls-3xs:.08em;
  --fw-regular:400;
  --fw-medium:500;
  --fw-semibold:600;
  --fw-bold:700;
  --fw-black:800;
  /* ---------- SPACE (px scale) ---------- */
  --sp-2:2px;
  --sp-3:3px;
  --sp-4:4px;
  --sp-5:5px;
  --sp-6:6px;
  --sp-7:7px;
  --sp-8:8px;
  --sp-9:9px;
  --sp-10:10px;
  --sp-11:11px;
  --sp-12:12px;
  --sp-13:13px;
  --sp-14:14px;
  --sp-16:16px;
  --sp-18:18px;
  --sp-20:20px;
  --sp-22:22px;
  --sp-24:24px;
  --sp-26:26px;
  --sp-30:30px;
  --sp-60:60px;
  /* ---------- RADIUS ---------- */
  --r-2:2px;
  --r-4:4px;
  --r-3:3px;
  --r-8:8px;
  --r-9:9px;
  --r-10:10px;
  --r-12:12px;
  --r-14:14px;
  --r-16:16px;
  --r-pill:20px;
  --r-round:999px;
  /* ---------- SIZE ---------- */
  --w-stage:1440px;
  --h-stage:900px;
  --h-hud:34px;
  --h-scene:200px;
  --h-tap:44px;
  --h-btn:30px;
  --w-aside:460px;
  --w-side:372px;
  --w-moment:980px;
  --w-prose:700px;
  --w-copy:520px;
  --pad-stage:22px 26px;
  --pad-card:16px 18px;
  --pad-btn:11px 16px;
  --pad-option:14px 16px;
  --pad-option-mobile:14px 16px;
  /* ---------- LAYOUT ---------- */
  --g-create:1fr var(--w-aside);
  --g-race:1fr 360px;
  --g-result:1fr 420px;
  --g-season:1.12fr 1fr;
  --g-styles:repeat(3,1fr);
  --g-srow:26px 1fr 30px 42px 46px;
  --g-crow:22px 1fr 84px 40px;
  --g-rrow:36px 54px 1fr 74px;
  --dur-fast:.15s;
  --dur-med:.35s;
  --ease:cubic-bezier(.4,.1,.2,1);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--tx);font-family:var(--ff-sans);-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:var(--w-stage);height:var(--h-stage);transform-origin:center center;position:relative;
  background:
    radial-gradient(1200px 700px at 15% -10%,var(--glow-gold),transparent 60%),
    radial-gradient(900px 600px at 95% 110%,var(--glow-blue),transparent 60%),
    linear-gradient(180deg,var(--ink),var(--ink2));
  border:1px solid var(--line-faint);border-radius:var(--r-16);padding:var(--pad-stage);overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute;inset:var(--pad-stage);display:none;flex-direction:column;min-height:0}
.screen.on{display:flex;overflow-x:hidden;overflow-y:auto}
.eyebrow{font-size:var(--fs-10-5);letter-spacing:var(--ls-xl);color:var(--gold);
  text-transform:uppercase;font-weight:var(--fw-bold)}
h1,h2,h3{font-family:var(--ff-serif);font-weight:var(--fw-regular);margin:0;letter-spacing:var(--ls-hero)}

/* ---------- surfaces ---------- */
.card{background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:var(--r-14);padding:var(--pad-card)}
.card.hi{border-color:var(--tint-gold-32);box-shadow:var(--shadow-card)}
.card-log{flex:1;overflow:hidden;display:flex;flex-direction:column}
.card-body{margin-top:var(--sp-10)}
.card-body-sm{margin-top:var(--sp-9)}
.card-body-xs{margin-top:var(--sp-8)}
.col{min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--sp-14);min-width:0}
.small{font-size:var(--fs-11-5);color:var(--muted)}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.is-hidden{display:none}

/* ---------- buttons ---------- */
.btn{font-family:var(--ff-sans);font-size:var(--fs-13);font-weight:var(--fw-bold);
  border-radius:var(--r-10);border:1px solid var(--line2);
  background:transparent;color:var(--slate);padding:var(--pad-btn);
  cursor:pointer;transition:var(--dur-fast);text-align:left}
.btn:hover{border-color:var(--line-hover);color:var(--cream);background:var(--tint-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.is-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold-mid));
  color:var(--gold-ink);border-color:var(--gold-line)}
.btn.is-gold:hover{filter:brightness(1.06);color:var(--gold-ink)}
.btn.sel{border-color:var(--gold);color:var(--gold);background:var(--tint-gold-08)}
.btn-block{width:100%;text-align:center;padding:var(--sp-14);font-size:var(--fs-14)}
.btn-block-sm{width:100%;text-align:center;padding:var(--sp-12);
  margin-top:var(--sp-8);font-size:var(--fs-13)}
.btn-next{margin-top:var(--sp-18);padding:var(--sp-14) var(--sp-22)}
.btn-season{margin-top:var(--sp-16);padding:var(--sp-14) var(--sp-22)}

/* ---------- wordmark ---------- */
.brand{display:flex;align-items:center;gap:var(--sp-10);font-weight:var(--fw-black);
  letter-spacing:var(--ls-md);font-size:var(--fs-12);white-space:nowrap}
.brand i{width:10px;height:10px;background:var(--gold);border-radius:var(--r-2);
  box-shadow:var(--shadow-gold);flex:none}
.brand span{color:var(--muted);font-weight:var(--fw-medium);
  letter-spacing:var(--ls-2xs);font-size:var(--fs-10-5)}

/* ---------- create / create ---------- */
.create{flex:1;display:grid;grid-template-columns:var(--g-create);
  gap:var(--sp-48);align-items:start;padding:var(--sp-56) var(--sp-30) 0;align-content:start}
.create h1{font-size:var(--fs-52);line-height:var(--lh-tight);color:var(--cream)}
.create h1 em{font-style:normal;color:var(--gold)}
.create p{font-size:var(--fs-15);line-height:1.65;color:var(--slate);
  margin:var(--sp-18) 0 0;max-width:var(--w-copy)}
.field{margin-bottom:var(--sp-16)}
.field-tight{margin-bottom:var(--sp-8)}
.field label{display:block;font-size:var(--fs-10-5);letter-spacing:var(--ls-label);
  color:var(--muted);margin-bottom:var(--sp-7);text-transform:uppercase}
.field input{width:100%;background:var(--sunken);border:1px solid var(--line2);
  border-radius:var(--r-9);padding:var(--sp-11) var(--sp-13);color:var(--cream);
  font-family:var(--ff-mono);font-size:var(--fs-15);outline:none}
.field input:focus{border-color:var(--gold2)}
.field-value{color:var(--slate);font-size:var(--fs-12-5)}
.styles{display:grid;grid-template-columns:var(--g-styles);gap:var(--sp-8)}
.styles .opt{border:1px solid var(--line2);border-radius:var(--r-10);
  padding:var(--sp-11) var(--sp-10);cursor:pointer;transition:var(--dur-fast);min-height:52px}
.opt:hover{border-color:var(--line-hover)}
.opt.sel{border-color:var(--gold);background:var(--tint-gold-08)}
.opt b{display:block;font-size:var(--fs-14);color:var(--cream);margin-bottom:var(--sp-3)}
.opt span{font-size:var(--fs-12);color:var(--slate);line-height:1.4;display:block}
.seedline{font-family:var(--ff-mono);font-size:var(--fs-11);color:var(--slate);margin-top:var(--sp-12)}
.legacy{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:var(--sp-4);
  font-size:var(--fs-12);color:var(--slate);text-decoration:none;letter-spacing:var(--ls-2xs)}
.legacy:hover{color:var(--gold)}

/* ---------- hud ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;height:var(--h-hud);
  margin-bottom:var(--sp-14);gap:var(--sp-16)}
.hud .right{display:flex;gap:var(--sp-18);font-family:var(--ff-mono);
  font-size:var(--fs-11);color:var(--slate);margin-left:auto;align-items:baseline}
.hud .right b{color:var(--cream);font-weight:var(--fw-semibold);font-size:var(--fs-16);letter-spacing:0}
.hudBtn{font-family:var(--ff-sans);font-size:var(--fs-10-5);font-weight:var(--fw-bold);
  letter-spacing:var(--ls-2xs);color:var(--slate);background:var(--tint-hover);
  border:1px solid var(--line2);border-radius:var(--r-8);padding:0 var(--sp-12);
  height:var(--h-btn);cursor:pointer;transition:var(--dur-fast);white-space:nowrap;flex:none}
.hudBtn:hover{color:var(--gold);border-color:var(--tint-gold-45)}

/* ---------- race : moment column ---------- */
.race-wrap{flex:1;display:grid;grid-template-columns:var(--g-race);gap:var(--sp-24);
  min-height:0;align-items:start}
.moment{display:flex;flex-direction:column;justify-content:center;
  max-width:var(--w-moment);min-width:0}
.moment .beat{font-family:var(--ff-mono);font-size:var(--fs-11);
  letter-spacing:var(--ls-lg);color:var(--gold2);margin-bottom:var(--sp-12)}
.moment .title{font-family:var(--ff-serif);font-weight:var(--fw-regular);font-size:var(--fs-28);line-height:var(--lh-snug);
  color:var(--cream);margin-bottom:var(--sp-12)}
.moment .prompt{font-size:var(--fs-15);line-height:1.65;
  color:var(--slate);margin-bottom:var(--sp-14);max-width:var(--w-prose)}
.opts{display:flex;flex-direction:column;gap:var(--sp-8);width:100%}
.opts .btn{padding:var(--pad-option);font-size:var(--fs-15);font-weight:var(--fw-bold);
  line-height:1.35;display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:center;column-gap:var(--sp-12);row-gap:var(--sp-3);
  min-height:52px;text-align:left;width:100%}
.opts .btn > span:not(.risk){grid-column:1;grid-row:1;min-width:0}
.opts .btn .risk{grid-column:2;grid-row:1 / span 2;justify-self:end;align-self:center;
  font-family:var(--ff-mono);font-size:var(--fs-11);letter-spacing:var(--ls-3xs);
  padding:var(--sp-3) var(--sp-8);border-radius:var(--r-pill);min-height:24px;
  display:inline-flex;align-items:center;border:1px solid transparent;white-space:nowrap}
.opts .btn .risk.sev0{color:var(--green);border-color:var(--tint-green-35);background:rgba(63,191,139,.10)}
.opts .btn .risk.sev1{color:var(--gold);border-color:var(--tint-gold-45);background:var(--tint-gold-08)}
.opts .btn .risk.sev2{color:#f0a25c;border-color:rgba(240,162,92,.45);background:rgba(240,162,92,.10)}
.opts .btn .risk.sev3{color:var(--warn);border-color:var(--tint-red-45);background:var(--tint-red-10)}
.opts .btn.danger{border-color:var(--tint-red-40)}
.opts .btn.danger:hover{border-color:var(--tint-red-75);background:var(--tint-red-07)}
.opts .btn.safe{border-color:var(--tint-green-28)}
.opts .btn small{grid-column:1;grid-row:2;display:block;min-width:0;font-weight:var(--fw-regular);
  font-size:var(--fs-13);line-height:1.45;color:var(--slate);margin-top:0}
.opts .btn.is-out{display:none}
.opts .btn.picked{border-color:var(--gold);color:var(--cream);background:var(--tint-gold-08)}
.opts .btn:hover small{color:var(--slate)}
.consequence{margin-top:var(--sp-12);font-size:var(--fs-15);line-height:var(--lh-copy);
  color:var(--gold);font-family:var(--ff-serif);opacity:0;transform:translateY(4px);
  transition:var(--dur-med);min-height:0}
.consequence.on{opacity:1;transform:none}

/* ---------- scene ---------- */
.scene{width:100%;height:var(--h-scene);border:1px solid var(--line);
  border-radius:var(--r-12);overflow:hidden;position:relative;margin-bottom:var(--sp-14);flex:none;
  background:linear-gradient(180deg,var(--scene-1),var(--scene-2))}
.scene svg{width:100%;height:100%;display:block;animation:sceneIn .5s ease}
@keyframes sceneIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.scene .cap{position:absolute;left:var(--sp-12);top:var(--sp-12);font-family:var(--ff-mono);
  font-size:var(--fs-12);font-weight:var(--fw-semibold);letter-spacing:var(--ls-sm);
  color:var(--gold);text-shadow:none;background:var(--overlay);border:1px solid var(--line2);
  border-radius:var(--r-pill);padding:var(--sp-3) var(--sp-9);max-width:68%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene .spd{position:absolute;right:var(--sp-16);top:var(--sp-14);font-family:var(--ff-mono);
  font-size:var(--fs-12);font-weight:var(--fw-semibold);color:var(--cream);
  background:var(--overlay);border:1px solid var(--line2);border-radius:var(--r-pill);
  padding:var(--sp-3) var(--sp-9);text-shadow:none}
.car{transition:transform var(--dur-med) var(--ease)}
.sceneMsg{align-self:flex-start;max-width:100%;box-sizing:border-box;
  font-family:var(--ff-mono);font-size:var(--fs-12);letter-spacing:var(--ls-sm);
  border-radius:var(--r-pill);background:var(--overlay);
  border:0 solid transparent;color:var(--slate);opacity:0;
  max-height:0;margin:0;padding:0;overflow:hidden;
  transition:.22s;white-space:nowrap;pointer-events:none;
  text-overflow:ellipsis}
.sceneMsg.on{opacity:1;max-height:36px;margin:0 0 var(--sp-10);
  padding:var(--sp-5) var(--sp-13);border-width:1px;border-color:var(--line2)}
.sceneMsg.ok{color:var(--gold);border-color:var(--tint-gold-55)}
.sceneMsg.bad{color:var(--warn);border-color:var(--tint-red-55)}
.scene.shake{animation:shk .4s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}
  45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:.25s;
  background:radial-gradient(circle at 50% 55%,var(--tint-gold-32),transparent 62%)}
.flash.bad{background:radial-gradient(circle at 50% 55%,var(--tint-red-28),transparent 62%)}
.flash.on{opacity:1}
.blink{animation:bl .75s steps(1,end) infinite}
@keyframes bl{0%,48%{opacity:1}50%,100%{opacity:.12}}

/* ---------- radio ---------- */
.radio-inline{display:flex;gap:var(--sp-11);align-items:flex-start;
  border-left:2px solid var(--tint-gold-45);padding:var(--sp-2) 0 var(--sp-2) var(--sp-13);
  margin:0 0 var(--sp-16);max-width:var(--w-prose)}
.radio-inline-wave{display:flex;align-items:center;gap:var(--sp-3);height:16px;
  margin-top:var(--sp-3);flex:none}
.radio-inline-wave i{width:2px;background:var(--tint-gold-60);border-radius:1px;
  display:block;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{height:4px;opacity:.4}50%{height:14px;opacity:.95}}
.radio-inline-body{min-width:0}
.radio-inline-who{font-family:var(--ff-mono);font-size:var(--fs-9);
  letter-spacing:var(--ls-md);color:var(--gold2);display:block}
.radio-inline-text{margin:var(--sp-5) 0 0;font-family:var(--ff-serif);
  font-size:var(--fs-13);line-height:var(--lh-body);color:var(--slate)}
.radio-head{display:flex;align-items:center;gap:var(--sp-8);margin-bottom:var(--sp-6)}
.radio-head b{font-size:var(--fs-11);letter-spacing:var(--ls-2xs);color:var(--gold)}
.radio-head span{font-size:var(--fs-10);color:var(--muted);font-family:var(--ff-mono)}
.wave{display:flex;align-items:center;gap:var(--sp-3);height:16px}
.wave i{width:2px;background:var(--tint-gold-55);border-radius:1px;display:block;
  animation:wv 1.1s ease-in-out infinite}

/* ---------- side ---------- */
.side{display:flex;flex-direction:column;gap:var(--sp-12);min-width:0}
.state-card{background:linear-gradient(180deg,var(--card-lift),var(--card2));
  border-color:var(--line2);border-left:3px solid var(--gold)}
.stat{display:flex;justify-content:space-between;font-size:var(--fs-12);
  padding:var(--sp-5) 0;border-bottom:1px solid var(--line-soft)}
.stat:last-child{border:0}
.stat span{color:var(--slate)}
.stat b{font-family:var(--ff-mono);font-size:var(--fs-14);color:var(--cream);font-weight:var(--fw-semibold)}
.badge{display:inline-block;font-size:var(--fs-10);letter-spacing:var(--ls-xs);
  padding:var(--sp-3) var(--sp-8);border-radius:var(--r-pill);
  border:1px solid var(--tint-gold-40);color:var(--gold)}
.rounds{display:flex;gap:var(--sp-4);margin-top:var(--sp-11)}
.rounds i{flex:1;height:4px;border-radius:var(--r-2);background:#1b2437;display:block;
  transition:.3s}
.rounds i.done{background:var(--tint-gold-45)}
.rounds i.podium{background:var(--gold);box-shadow:0 0 8px var(--tint-gold-45)}
.rounds i.dnf{background:var(--red)}
.rounds i.cur{background:var(--track-dim)}
.log-item{margin-bottom:var(--sp-4)}
.log-empty{color:var(--slate)}
.log{margin-top:var(--sp-8);line-height:var(--lh-body);color:var(--slate);
  font-size:var(--fs-11-5);overflow-y:auto}
.savedot{font-family:var(--ff-mono);font-size:var(--fs-11);color:var(--slate);
  letter-spacing:var(--ls-2xs);margin-top:var(--sp-6);transition:.4s}
.savedot.on{color:var(--gold2)}

/* ---------- result ---------- */
.resultWrap{flex:1;display:grid;grid-template-columns:var(--g-result);
  gap:var(--sp-32);min-height:0;align-items:start;padding-top:var(--sp-8)}
.result-head{display:flex;align-items:flex-end;gap:var(--sp-18);
  margin:var(--sp-10) 0 var(--sp-6)}
.result-head-meta{padding-bottom:var(--sp-10)}
.result-head-sub{margin-top:var(--sp-8)}
.posBig{font-family:var(--ff-mono);font-size:var(--fs-96);line-height:var(--lh-flat);
  color:var(--gold);font-weight:var(--fw-semibold)}
.posBig small{font-size:var(--fs-26);color:var(--muted);font-weight:var(--fw-regular)}
.result-table{margin-top:var(--sp-10)}
.rrow{display:grid;grid-template-columns:var(--g-rrow);gap:var(--sp-10);
  font-size:var(--fs-12);padding:var(--sp-5) 0;border-bottom:1px solid var(--line-faint);
  font-family:var(--ff-mono);color:var(--slate)}
.rrow.me{color:var(--gold);box-shadow:inset 3px 0 0 var(--gold);padding-left:var(--sp-10);
  background:rgba(242,193,78,.045);border-radius:var(--r-4)}
.rrow-team{font-family:var(--ff-sans);font-size:var(--fs-11)}
.story{font-family:var(--ff-serif);font-size:var(--fs-14);
  line-height:var(--lh-story);color:var(--slate)}
.story-spaced{margin-top:var(--sp-16)}
.story b{color:var(--cream);font-weight:var(--fw-semibold);
  font-family:var(--ff-sans);font-size:var(--fs-13)}
.track-art{position:absolute;right:-120px;bottom:-160px;width:720px;height:520px;
  opacity:.06;pointer-events:none}

/* ---------- season ---------- */
.seasonWrap{flex:1;display:grid;grid-template-columns:var(--g-season);
  gap:var(--sp-24);align-items:start;min-height:0}
.season-title{font-size:var(--fs-30);line-height:var(--lh-snug);
  margin:var(--sp-8) 0 var(--sp-14);color:var(--cream)}
.srow{display:grid;grid-template-columns:var(--g-srow);gap:var(--sp-8);
  font-family:var(--ff-mono);font-size:var(--fs-11);color:var(--slate);
  padding:var(--sp-5) 0;border-bottom:1px solid var(--line-faint);align-items:center}
.srow.head{color:var(--muted);font-size:var(--fs-9);
  letter-spacing:var(--ls-sm);border-bottom-color:var(--line-rule);
  padding-bottom:var(--sp-6)}
.srow.me{color:var(--gold)}
.srow.pending{color:var(--ghost)}
.crow{display:grid;grid-template-columns:var(--g-crow);gap:var(--sp-6);
  font-size:var(--fs-11);padding:var(--sp-4) 0;border-bottom:1px solid var(--line-faint);
  font-family:var(--ff-mono);color:var(--slate);align-items:center}
.crow.me{color:var(--gold)}
.crow-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-team{font-size:var(--fs-9-5);color:#6c788c}
.rlog{font-size:var(--fs-11-5);line-height:1.65;color:var(--slate);
  max-height:168px;overflow-y:auto;padding-right:var(--sp-4)}
.rlog div{padding:var(--sp-3) 0;border-bottom:1px solid var(--line-track)}
.rlog b{color:var(--gold);font-family:var(--ff-mono);font-size:var(--fs-10);
  margin-right:var(--sp-6)}
.rlog em{font-style:normal;color:var(--muted);font-family:var(--ff-mono);
  font-size:var(--fs-10);margin-right:var(--sp-6)}
.tierBox{border-radius:var(--r-12);padding:var(--sp-14) var(--sp-16);
  border:1px solid var(--line2);background:var(--tint-panel)}
.tierBox.a{border-color:var(--tint-gold-50);background:var(--tint-gold-06)}
.tierBox.c{border-color:var(--tint-red-40);background:var(--tint-red-05)}
.tierBox h2{font-size:var(--fs-24);color:var(--cream);margin-bottom:var(--sp-10)}
.tierBox .eyebrow{margin-bottom:var(--sp-6)}
.tierBox .story{font-size:var(--fs-13)}
.season-end{margin-top:var(--sp-16)}

    right:auto;max-width:64%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .posBig{font-size:var(--fs-58)}

}
.hudBtn:focus-visible,.btn:focus-visible,.opt:focus-visible,.chipTy:focus-visible,
.field input:focus-visible,.opts .btn:focus-visible,a:focus-visible,button:focus-visible{
  outline:2px solid var(--gold2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .wave i,.radio-inline-wave i{animation:none;height:8px;opacity:.7}
  .scene.shake{animation:none}
}

/* ---------- spec v2 : create / result 收尾 ---------- */
#startBtn,#nextBtn,#advanceBtn,#resumeRaceBtn,#newSeasonBtn{min-height:48px}
#nextBtn,#resumeRaceBtn,#newSeasonBtn{min-width:200px}

@media (max-width:980px){
  #startBtn,#nextBtn,#advanceBtn,#resumeRaceBtn,#newSeasonBtn{width:100%;min-height:52px}

}

._disabled,.btn:disabled{opacity:.4;pointer-events:none}

</style>

<body>
<div id="app"><div id="stage">
<div class="track-art" id="art"></div>

<!-- 1. 建立車手 -->
<section class="screen on" id="scCreate">
  <div class="brand" id="createBrand"></div>
  <div class="create">
    <div>
      <div class="eyebrow" id="createEyebrow"></div>
      <h1 id="createHeadline"></h1>
      <p id="createLede"></p>
    </div>
    <div class="card hi">
      <div class="field">
        <label id="labelName"></label>
        <input id="nameIn" value="KAI" maxlength="12" autocomplete="off">
      </div>
      <div class="field">
        <label id="labelStyle"></label>
        <div class="styles" id="styles"></div>
      </div>
      <div class="field field-tight">
        <label id="labelTeam"></label>
        <div class="field-value" id="teamValue"></div>
      </div>
      <button class="btn is-gold btn-block" id="startBtn"></button>
      <button class="btn btn-block-sm" id="continueBtn" style="display:none"></button>
      <div class="seedline" id="seedLine">種子 · ——</div>
      
    </div>
  </div>
</section>

<!-- 2. 比賽 -->
<section class="screen" id="scRace">
  <div class="hud">
    <div class="brand" id="hudBrand"></div>
    <div class="right">
      <div><span data-l="position"></span> <b id="hPos">P6</b></div>
      <div><span data-l="score"></span> <b id="hPts">0</b></div>
      <div><span data-l="reputation"></span> <b id="hRep">0</b></div>
      <div><span data-l="fitness"></span> <b id="hFit">100</b></div>
    </div>
    <button class="hudBtn" id="tableBtn" data-l="table"></button>
  </div>
  <div class="race-wrap">

      <div class="scene" id="scene">
        <svg id="sceneSvg" viewBox="0 0 800 172" preserveAspectRatio="none"></svg>

</section>

<!-- 3. 結果 -->
<section class="screen" id="scResult">

<section class="screen" id="scSeason">
  <div class="hud">
    <div class="brand"><i></i> SEASON NOTES <span id="hudSeason">SEASON 2027</span></div>
    <div class="right"><div><span data-l="score"></span> <b id="hPts3">0</b></div><div><span data-l="reputation"></span> <b id="hRep3">0</b></div></div>

      </div>

</section>

<script>
/* =====================================================================

/* 場景 helper（pack 可以自備） */
function lt(x0,x1,y,step,w,op){
  let s='';
  for(let x=x0;x<x1;x+=step){s+='<rect x="'+x+'" y="'+y+'" width="'+(w||8)+'" height="2.6" fill="#f2c14e" opacity="'+(op||.35)+'"/>';}
  return s;
}
function kerbs(x0,x1,y,step){
  let s='';
  for(let i=0,x=x0;x<x1;x+=step,i++){
    s+='<rect x="'+x+'" y="'+y+'" width="'+step+'" height="4" fill="'+(i%2?'#e9e3d5':'#c8402f')+'" opacity=".8"/>';
  }
  return s;
}

function stage(bg1,bg2,horizon,deco){
  return '<rect x="-20" y="-20" width="840" height="215" fill="'+bg1+'"/>'+
    '<rect x="-20" y="-20" width="840" height="'+(horizon+18)+'" fill="url(#gStage)"/>'+
    '<rect x="-20" y="'+(horizon-30)+'" width="840" height="34" fill="url(#gWarm)" opacity=".55"/>'+
    deco+
    '<path d="M-20 '+horizon+' L820 '+(horizon-6)+' L820 176 L-20 176 Z" fill="'+bg2+'"/>'+
    '<defs>'+
    '<linearGradient id="gStage" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#243a58"/><stop offset="1" stop-color="#2f4a6d"/></linearGradient>'+
    '<linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#f2c14e" stop-opacity="0"/><stop offset="1" stop-color="#f2c14e" stop-opacity=".5"/></linearGradient>'+
    '</defs>';
}

<script>
/* =====================================================================
 * FRAMEWORK v1 — 主題無關嘅生涯／抉擇引擎
 * 唔識 F1、唔識任何題材；所有題材內容由 PACK 提供（src/packs/*.js）
 * 規格：FRAMEWORK.md
 * ===================================================================== */
'use strict';
var PACKS = window.PACKS || (window.PACKS = {});
var PACK_ID = (function(){
  try{ return new URLSearchParams(location.search).get('pack') || window.DEFAULT_PACK || 'f1'; }
  catch(e){ return window.DEFAULT_PACK || 'f1'; }
})();
var PACK = PACKS[PACK_ID] || PACKS[window.DEFAULT_PACK] || PACKS[Object.keys(PACKS)[0]];
var L = PACK.labels;

/* 卡牌註冊：pack 只提供陣列，framework 負責 id */
var CARD = {};
PACK.cats.forEach(function(cat){
  (PACK.cards[cat]||[]).forEach(function(c,i){
    c.id = cat+'-'+(i+1); c.cat = cat; CARD[c.id] = c;
  });
});

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ============ 常數 ============ */
function newCareer(){
  return {v:2, seed:(Math.random()*1e9)|0, round:1, races:PACK.meta.rounds,
    points:0, rep:0, fit:100, results:[], repLog:[], rivalPts:{}, decks:{}, race:null, done:false,
    field:PACK.meta.field||12,
    name:PACK.create.defaultName, style:Object.keys(PACK.archetypes)[0]};
}
let C=newCareer();
let R=null;
let hasSave=false;
let activeScreen='scCreate';
let beatGen=0;
let resolving=false;

function save(){
  try{
    localStorage.setItem(PACK.meta.saveKey, JSON.stringify(C));
    const d=$('saveDot'); if(d){d.classList.add('on'); setTimeout(()=>d.classList.remove('on'),700);}
  }catch(e){}
}
function loadSave(){
  try{
    const raw=localStorage.getItem(PACK.meta.saveKey);
    if(!raw) return false;
    const o=JSON.parse(raw);
    if(!o||o.v!==2||!Array.isArray(o.results)) return false;
    C=Object.assign(newCareer(),o);
    R=C.race||null;
    hasSave=true;
    return true;
  }catch(e){ return false; }
}
function clearSave(){ try{localStorage.removeItem(PACK.meta.saveKey);}catch(e){} }

/* 牌庫 */
function initDecks(){
  C.decks={};
  PACK.cats.forEach(cat=>{
    const rnd=mulberry(hash(C.seed+'|'+cat));
    C.decks[cat]={order:shuffle(PACK.cards[cat].map(c=>c.id),rnd), idx:0, last:null};
  });
}
function drawCard(cat){
  const d=C.decks[cat];
  if(!d){ initDecks(); return drawCard(cat); }
  if(d.idx>=d.order.length){
    const rnd=mulberry(hash(C.seed+'|'+cat+'|'+C.round+'|'+d.order.join(',')));
    d.order=shuffle(PACK.cards[cat].map(c=>c.id),rnd);
    d.idx=0;
    if(d.order[0]===d.last&&d.order.length>1){ const t=d.order[0]; d.order[0]=d.order[1]; d.order[1]=t; }
  }
  const id=d.order[d.idx++];
  d.last=id;
  return id;
}
function makeRace(){
  const rnd=mulberry(hash(C.seed+'|round'+C.round+'|cards'));
  const cats=shuffle(PACK.cats.slice(),rnd);
  const cards=cats.map(cat=>drawCard(cat));
  const startPos=6+Math.floor(rnd()*4);
  return {cards:cards, beats:0, pos:startPos, startPos:startPos, risk:0, log:[], crashed:false, laps:30, result:null};
}

/* ============ 場景渲染 ============ */
let laneEls=[], carEls={}, playerF=.52, rivalF=[.6,.66], anim=null, rafId=null, lastTs=0, curCat='straight';
let CARW=22, CARH=11;

function carSVG(spec,w,h,isMe){
  // 俯視 F1 剪影：車鼻 → 前翼 → 座艙 → 側箱 → 尾翼 ＋ 四條胎
  const W=w, H=h;
  const k=(v)=>+(v).toFixed(2);
  let g='<g class="car" transform="translate(0,0)">';
  // 四條胎
  const tyre=(x,y)=>'<rect x="'+k(x-W*0.13)+'" y="'+k(y-H*0.19)+'" width="'+k(W*0.26)+'" height="'+k(H*0.38)+'" rx="'+k(H*0.10)+'" fill="#080c12" opacity=".92"/>';
  g+=tyre(W*0.26, -H*0.52)+tyre(W*0.26, H*0.52)+tyre(-W*0.24,-H*0.52)+tyre(-W*0.24,H*0.52);
  // 主體
  const body='M '+k(W*0.50)+' 0 '+
    'L '+k(W*0.30)+' '+k(-H*0.16)+' '+
    'L '+k(W*0.10)+' '+k(-H*0.26)+' '+
    'L '+k(-W*0.16)+' '+k(-H*0.30)+' '+
    'L '+k(-W*0.34)+' '+k(-H*0.44)+' '+
    'L '+k(-W*0.50)+' '+k(-H*0.44)+' '+
    'L '+k(-W*0.50)+' '+k(H*0.44)+' '+
    'L '+k(-W*0.34)+' '+k(H*0.44)+' '+
    'L '+k(-W*0.16)+' '+k(H*0.30)+' '+
    'L '+k(W*0.10)+' '+k(H*0.26)+' '+
    'L '+k(W*0.30)+' '+k(H*0.16)+' Z';
  g+='<path d="'+body+'" fill="'+spec.c+'" stroke="'+(isMe?'#fff3d0':'rgba(6,10,18,.85)')+'" stroke-width="'+(isMe?1.4:0.9)+'" stroke-linejoin="round"/>';
  // 前翼
  g+='<rect x="'+k(W*0.42)+'" y="'+k(-H*0.40)+'" width="'+k(W*0.09)+'" height="'+k(H*0.80)+'" rx="'+k(H*0.06)+'" fill="'+spec.c+'" opacity=".95"/>';
  // 尾翼
  g+='<rect x="'+k(-W*0.52)+'" y="'+k(-H*0.46)+'" width="'+k(W*0.10)+'" height="'+k(H*0.92)+'" rx="'+k(H*0.05)+'" fill="'+spec.c+'" opacity=".95"/>';
  // 座艙
  g+='<ellipse cx="'+k(W*0.04)+'" cy="0" rx="'+k(W*0.10)+'" ry="'+k(H*0.20)+'" fill="#0b1018" opacity=".9"/>';
  if(isMe){
    g+='<circle cx="'+k(W*0.04)+'" cy="0" r="'+k(Math.max(1.6,H*0.10))+'" fill="#f7e3ae"/>';
    g+='<text x="0" y="'+k(-H*0.86)+'" text-anchor="middle" font-family="ui-monospace,monospace" '+
       'font-size="'+k(Math.max(11,H*0.85))+'" font-weight="700" fill="#f7e3ae">"+L.selfMark+"</text>';
  }
  g+='</g>';
  return '<g class="car"><g transform="scale(1,'+(1/1.55)+')">'+g.replace('<g class="car" transform="translate(0,0)">','<g>')+'</g></g>';
}

function paintScene(cat,preserve){
  const sc=PACK.scenes[cat]();
  curCat=cat;
  const box=$('scene').getBoundingClientRect();
  const bw=box.width||760, bh=box.height||172;
  const sx=bw/800, sy=bh/172;
  CARW=clamp(36/Math.max(sx,.05),18,72);
  CARH=clamp(17/Math.max(sy,.05),9,30);
  const svg=$('sceneSvg');
  const isStatic=!sc.lanes||!sc.lanes.length;
  let cars='';
  if(!isStatic){
    cars+=carSVG({c:'#f2c14e',r:'#fff3d0'},CARW,CARH,true);
    cars+=carSVG(sc.cars[0],CARW,CARH,false);
    cars+=carSVG(sc.cars[1],CARW,CARH,false);
  }
  const ZK=sc.zoom||1.55, ZC=sc.zoomCenter||126;
  svg.setAttribute('viewBox','0 0 800 172');
  svg.setAttribute('preserveAspectRatio', isStatic?'xMidYMid slice':'none');
  svg.innerHTML='<g id="sceneAll" transform="translate(0,'+ZC+') scale(1,'+ZK+') translate(0,-'+ZC+')">'
    + sc.svg + (isStatic?'':'<g id="carLayer">'+cars+'</g>') + '</g>';
  const groups=svg.querySelectorAll('#carLayer .car');
  carEls={me:groups[0],r1:groups[1],r2:groups[2]};
  laneEls=[svg.querySelector('#ln0'),svg.querySelector('#ln1'),svg.querySelector('#ln2')];
  $('sceneCap').textContent=sc.cap;
  $('sceneSpd').textContent=sc.spd;
  if(isStatic){ return; }
  if(!preserve){
    playerF=sc.init.me.f; rivalF=[sc.init.rv[0].f,sc.init.rv[1].f];
  }
  placeAt(carEls.me,sc.init.me.lane,playerF);
  placeAt(carEls.r1,sc.init.rv[0].lane,rivalF[0]);
  placeAt(carEls.r2,sc.init.rv[1].lane,rivalF[1]);
  carEls.me.setAttribute('opacity','1');
}
function placeAt(g,lane,frac){
  if(!g) return;
  const p=laneEls[lane]||laneEls[1]||laneEls[0];
  if(!p) return;
  const L=p.getTotalLength();
  const pt=p.getPointAtLength(L*clamp(frac,0,1));
  g.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+')');
}
function setMsg(txt,kind){
  const m=$('sceneMsg');
  m.textContent=txt; m.className='sceneMsg on'+(kind?' '+kind:'');
  $('sceneFlash').className='flash on'+(kind==='bad'?' bad':'');
  $('scene').classList.toggle('shake',kind==='bad');
}
function clearMsg(){
  $('sceneMsg').className='sceneMsg';
  $('sceneFlash').className='flash';
  $('scene').classList.remove('shake');
}
function easeInOut(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}

function runAnim(o){
  if(!carEls.me){ anim=null; return; }   // static 場景：無車可動
  anim={t:0,dur:o.dur||1.7,from:playerF,to:o.to,lane:o.lane,crash:!!o.crash,back:!!o.back};
  carEls.me.setAttribute('opacity','1');
  lastTs=0;
  if(!rafId) rafId=requestAnimationFrame(tick);
}
function tick(ts){
  if(!anim||!carEls.me){ rafId=null; return; }
  if(!lastTs) lastTs=ts;
  const dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts;
  anim.t+=dt;
  const p=Math.min(1,anim.t/anim.dur), e=easeInOut(p);
  playerF=anim.from+(anim.to-anim.from)*e;
  if(anim.crash){
    const lane=laneEls[anim.lane]||laneEls[1];
    const L=lane.getTotalLength();
    const pt=lane.getPointAtLength(L*clamp(playerF,0,1));
    carEls.me.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+') rotate('+((1-p)*18).toFixed(1)+')');
    carEls.me.setAttribute('opacity',String(1-p*0.5));
  }else{
    placeAt(carEls.me,anim.lane,playerF);
  }
  if(anim.back){
    rivalF[0]=rivalF[0]-0.055*e;
    placeAt(carEls.r1,1,rivalF[0]);
  }
  if(p<1){ rafId=requestAnimationFrame(tick); }
  else { rafId=null; anim=null; }
}

/* ============ 畫面流程 ============ */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  const el=$(id); if(!el) return;
  el.classList.add('on');
  activeScreen=id;
  document.body.dataset.screen=id;
  if(window.innerWidth<980) window.scrollTo(0,0);
}

function paintHud(){
  $('hPts').textContent=C.points;
  $('hRep').textContent=(C.rep>0?'+':'')+C.rep;
  $('hFit').textContent=C.fit;
  $('hudRace').textContent='ROUND '+C.round+' · '+C.races;
  $('hudRace2').textContent='ROUND '+C.round+' · '+C.races;
  $('hPts2').textContent=C.points;
  $('hRep2').textContent=(C.rep>0?'+':'')+C.rep;
  $('hPts3').textContent=C.points;
  $('hRep3').textContent=(C.rep>0?'+':'')+C.rep;
  $('hudSeason').textContent=L.seasonWord+' '+PACK.meta.season;
  if(R){
    $('sPos').textContent='P'+R.pos;
    if($('hPos')) $('hPos').textContent='P'+R.pos;
    $('sRisk').textContent=R.risk+'%';
    $('sTrack').textContent=R.pos<=3?L.trackFront:(R.pos<=7?L.trackMid:L.trackBack);
  }
  // progress dots
  let dots='';
  for(let i=0;i<C.races;i++){
    const r=C.results[i];
    let cls='';
    if(r) cls = r.dnf?'dnf':(r.pos<=3?'podium':'done');
    else if(i===C.round-1) cls='cur';
    dots+='<i class="'+cls+'"></i>';
  }
  const pr=$('rounds'); if(pr) pr.innerHTML=dots;
}

function startCareer(){
  const nm=($('nameIn').value||'KAI').trim().toUpperCase().slice(0,12)||'KAI';
  C=newCareer();
  C.name=nm; C.style=document.querySelector('#styles .opt.sel')?document.querySelector('#styles .opt.sel').dataset.s:'brake';
  initDecks();
  R=null; hasSave=true;
  save();
  startRace();
}
function startRace(){
  if(!R){ R=makeRace(); C.race=R; save(); }
  else { C.race=R; }
  playerF=.52; rivalF=[.6,.66]; anim=null;
  clearMsg();
  $('log').innerHTML='<span class="log-empty">'+L.recordEmpty+'</span>';
  paintHud();
  show('scRace');
  renderBeat();
}

function hideAdvance(){
  const b=$('advanceBtn');
  if(!b) return;
  b.hidden=true;
  b.disabled=false;
  b.onclick=null;
}
function showAdvance(last, gen){
  const b=$('advanceBtn');
  if(!b || gen!==beatGen) return;
  b.hidden=false;
  b.disabled=false;
  b.textContent=last?L.seeResult:L.nextDecision;
  b.onclick=function(){
    if(gen!==beatGen || !R) return;
    b.disabled=true;
    resolving=false;
    clearMsg();
    R.beats++;
    C.race=R;
    save();
    if(R.beats<R.cards.length) renderBeat();
    else finishRace();
  };
  if(window.innerWidth<980) b.scrollIntoView({block:'nearest',inline:'nearest'});
}
function renderBeat(){
  beatGen++;
  resolving=false;
  hideAdvance();
  const id=R.cards[R.beats], card=CARD[id];
  if(!card){ finishRace(); return; }
  $('beatLbl').textContent='DECISION '+(R.beats+1)+' / '+R.cards.length+'  ·  '+card.cat.toUpperCase();
  if(window.innerWidth<980) window.scrollTo(0,0);
  $('beatTitle').textContent=card.t;
  $('beatPrompt').textContent=card.p;
  $('radio').textContent='「'+card.r+'」';
  $('radioWho').textContent=card.who||'RACE ENGINEER';
  $('cons').classList.remove('on');
  $('cons').textContent='';
  clearMsg();
  paintScene(card.cat,false);
  paintHud();
  if(R.log&&R.log.length) renderLog();
  $('sPhase').textContent=L.phases[R.beats]||L.phaseFallback;
  const wrap=$('opts'); wrap.innerHTML='';
  card.o.forEach((o,i)=>{
    const btn=document.createElement('button');
    const rk=Math.round((o.fx&&o.fx.risk?o.fx.risk:0)*PACK.archetypes[C.style].riskMul);
    const sev=rk===0?'sev0':(rk<10?'sev1':(rk<25?'sev2':'sev3'));
    btn.className='btn'+(rk>=14?' danger':(rk===0?' safe':''));
    const riskHTML='<span class="risk '+sev+'">'+(rk?L.riskWord+' '+rk+'%':L.safe)+'</span>';
    btn.innerHTML='<span>'+o.t+'</span><small>'+o.s+'</small>'+riskHTML;
    btn.onclick=()=>choose(i);
    wrap.appendChild(btn);
  });
  document.body.dataset.beat=String(R.beats);
  document.body.dataset.cat=card.cat;
}

function choose(i){
  const card=CARD[R.cards[R.beats]];
  const o=card.o[i];
  const fx=o.fx||{};
  const riskPct=Math.round((fx.risk||0)*PACK.archetypes[C.style].riskMul);
  const crashChance=riskPct*0.45+R.risk*0.10;
  const crash=crashChance>0 && Math.random()*100<crashChance;

  R.risk=Math.min(95,Math.round(R.risk*0.55+riskPct));
  if(fx.d&&!crash) R.pos=clamp(R.pos-fx.d,1,12);
  if(fx.rep) C.rep+=fx.rep;
  if(fx.fit) C.fit=clamp(C.fit+fx.fit,30,100);
  R.laps=Math.max(2,R.laps-5);
  if(crash) R.crashed=true;
  R.log.push({t:card.t,l:o.l});
  if(fx.rep) C.repLog.push({round:C.round,d:fx.rep,t:o.t});
  renderLog();
  paintHud();

  const btns=Array.prototype.slice.call(document.querySelectorAll('#opts .btn'));
  btns.forEach(function(x,idx){
    x.disabled=true;
    if(idx===i) x.classList.add('picked');
    else x.classList.add('is-out');
  });
  resolving=true;
  const gen=beatGen;
  const last=R.beats+1>=R.cards.length;
  $('cons').textContent=o.l;
  $('cons').classList.add('on');
  hideAdvance();

  const lane=i===0?0:(i===1?1:2);
  let to=playerF,msg=L.samePlace,kind='';
  if(crash){ to=playerF+0.02; msg=L.crashMsg; kind='bad'; }
  else if((fx.d||0)>0){ to=0.82; msg=L.overtake+' +'+fx.d+' '+L.places; kind='ok'; }
  else if((fx.d||0)<0){ to=0.34; msg=L.overtaken+' '+fx.d+' '+L.places; kind='bad'; }
  else { to=Math.min(0.72,playerF+0.02); }

  runAnim({lane:lane,to:to,crash:crash,back:!crash&&(fx.d||0)>0,dur:1.7});
  setTimeout(function(){
    if(gen!==beatGen) return;
    setMsg(msg,kind);
    showAdvance(last, gen);
  }, crash?800:620);
}

function renderLog(){
  if(!R||!R.log.length) return;
  $('log').innerHTML=R.log.map(function(x){
    return '<div class="log-item"><span style="color:var(--faint)">·</span> '+x.l+'</div>';
  }).join('');
  $('log').scrollTop=0;
}

/* ============ 賽果 ============ */
function finishRace(){
  beatGen++;
  resolving=false;
  hideAdvance();
  document.body.dataset.race='done';
  const dnf=!!R.crashed;
  let pos=R.pos- PACK.archetypes[C.style].bonus + (Math.floor(Math.random()*3)-1);
  if(C.fit<55) pos+=1;
  pos=clamp(pos,1,12);
  if(dnf) pos=12;
  const pts=dnf?0:PACK.scoring[pos-1];
  const repGain=dnf?-1:(pos<=3?3:(pos<=6?1:0));
  C.points+=pts;
  C.rep+=repGain;
  C.fit=clamp(C.fit-(dnf?8:4),30,100);
  if(repGain) C.repLog.push({round:C.round,d:repGain,t:(dnf?L.dnf+' · ':('P'+pos+' · '))+PACK.entities.circuits[(C.round-1)%PACK.entities.circuits.length].s});

  // 全場名次（其他 11 架）
  const order=[];
  const pool=shuffle(PACK.entities.rivals.slice(),mulberry(hash(C.seed+'|order'+C.round)));
  for(let p=1;p<=12;p++){
    if(p===pos) order.push({p:p,name:C.name,team:'AURORA JR',me:true});
    else order.push({p:p,name:pool.pop()||'—',team:PACK.entities.teams[(p*3+C.round)%PACK.entities.teams.length],me:false});
  }
  order.forEach(function(e){ if(!e.me) C.rivalPts[e.name]=(C.rivalPts[e.name]||0)+PACK.scoring[e.p-1]; });

  const res={round:C.round,pos:pos,dnf:dnf,pts:pts,rep:repGain,circuit:PACK.entities.circuits[(C.round-1)%PACK.entities.circuits.length],order:order};
  R.result=res;
  C.results.push(res);
  C.race=R;
  save();
  renderResult(res);
  show('scResult');
}

function renderResult(res){
  $('hudRace2').textContent=L.roundWord+' '+res.round+' · '+C.races;
  $('hPts2').textContent=C.points;
  $('hRep2').textContent=(C.rep>0?'+':'')+C.rep;
  $('resEyebrow').textContent=L.roundWord+' '+res.round+' · '+res.circuit.n;
  $('resPos').innerHTML='P'+res.pos+'<small>'+L.ofField+C.field+'</small>';
  $('resPts').textContent=res.dnf?'DNF':(res.pts?('+'+res.pts+' '+L.pointsSuffix):L.noPoints);
  $('resHead').textContent=res.dnf?L.dnf:(res.pos<=3?L.podium:(res.pos<=6?L.pointsFinish:L.finished));
  $('resStory').innerHTML=PACK.narrative.story({res:res,C:C,R:R,style:PACK.archetypes[C.style].label});
  let rows='<div class="rrow"><span>'+L.colPos+'</span><span>'+L.colName+'</span><span>'+L.colTeam+'</span><span>'+L.colPts+'</span></div>';
  res.order.forEach(function(e){
    rows+='<div class="rrow'+(e.me?' me':'')+'"><span>'+e.p+'</span><span>'+e.name+'</span>'+
      '<span class="rrow-team">'+e.team+'</span><span>'+PACK.scoring[e.p-1]+'</span></div>';
  });
  $('resTable').innerHTML=rows;
  $('nextBtn').textContent = res.round<C.races ? L.nextRace : L.seeSeason;
  paintHud();
}

function backToRace(){
  if(C.done){ renderSeason(true); show('scSeason'); return; }
  if(R&&R.result){ renderResult(R.result); show('scResult'); return; }
  if(R&&resolving){ show('scRace'); return; }
  if(R){ show('scRace'); renderBeat(); return; }
  show('scCreate');
}
$('backBtn').onclick=backToRace;
$('resumeRaceBtn').onclick=backToRace;
function resetCareer(){
  beatGen++;
  resolving=false;
  hideAdvance();
  clearSave(); hasSave=false;
  C=newCareer(); R=null;
  $('seedLine').textContent=L.seedWord+' · hk'+String(Math.abs(C.seed)%1000000).padStart(6,'0');
  $('nameIn').value=PACK.create.defaultName;
  $('continueBtn').style.display='none';
  $('continueBtn').textContent=L.continueCareer;
  $('startBtn').textContent=PACK.create.cta;
  document.querySelectorAll('#styles .opt').forEach(function(x){
    x.classList.toggle('sel',x.dataset.s===Object.keys(PACK.archetypes)[0]);
  });
  paintHud();
  show('scCreate');
}
$('newSeasonBtn').onclick=resetCareer;
$('restartBtn').onclick=resetCareer;

document.querySelectorAll('.radio-inline-wave i').forEach(function(b,i){
  b.style.animationDelay=(i*0.13)+'s';
  b.style.height=(4+Math.random()*10)+'px';
});

/* ============ 背景賽道剪影 ============ */
(function art(){
  const pts=[[706,392],[520,394],[262,394],[168,380],[116,332],[102,270],[132,214],[198,194],
    [252,176],[286,130],[332,90],[406,72],[472,78],[522,106],[554,150],[598,176],[652,174],[696,148],
    [718,182],[728,240],[724,300],[716,352]];
  const d=pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1];}).join(' ')+' Z';
  $('art').innerHTML='<svg viewBox="0 0 834 504" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+d+'" fill="none" stroke="#f2c14e" stroke-width="26" stroke-linejoin="round"/>'+
    '<path d="'+d+'" fill="none" stroke="#05080f" stroke-width="16" stroke-linejoin="round"/></svg>';
})();

/* ============ 載入 / 續玩 ============ */
function resume(){
  if(!hasSave) return false;
  if(C.done){ renderSeason(true); show('scSeason'); return true; }
  if(R){
    if(R.result){ renderResult(R.result); show('scResult'); return true; }
    show('scRace');
    renderBeat();
    return true;
  }
  if(C.results.length&&C.results.length>=C.races){ endSeason(); return true; }
  if(C.results.length){ C.round=C.results.length+1; startRace(); return true; }
  return false;
}

function boot(){
  const loaded=loadSave();
  if(loaded){
    $('seedLine').textContent=L.seedWord+' · hk'+String(Math.abs(C.seed)%1000000).padStart(6,'0');
    $('nameIn').value=C.name;
    document.querySelectorAll('#styles .opt').forEach(function(x){
      x.classList.toggle('sel',x.dataset.s===C.style);
    });
    $('continueBtn').style.display='block';
    $('continueBtn').textContent=L.continueCareer.replace(' →','')+' · '+L.roundWord+' '+
      Math.min(C.round,C.races)+' / '+C.races+(C.done?' · '+L.seasonEnd:'')+' →';
    $('startBtn').textContent=L.restartShort;
    if(C.done||R||C.results.length){ resume(); }
  }else{
    C=newCareer();
    $('seedLine').textContent=L.seedWord+' · hk'+String(Math.abs(C.seed)%1000000).padStart(6,'0');
  }
  paintHud();
}

/* fit */
function fit(){
  const st=$('stage');
  if(window.innerWidth<980){
    st.style.transform='none'; st.style.width='100%'; st.style.height='auto';
    document.documentElement.style.overflowY='auto';
    return;
  }
  document.documentElement.style.overflowY='hidden';
  st.style.width='1440px'; st.style.height='900px';
  const s=Math.min(window.innerWidth/1490,window.innerHeight/950,1.3);
  st.style.transform='scale('+s+')';
}
let rz=null;
window.addEventListener('resize',function(){
  fit();
  clearTimeout(rz);
  rz=setTimeout(function(){
    if(activeScreen==='scRace'&&R&&R.beats<R.cards.length){
      const card=CARD[R.cards[R.beats]];
      if(card) paintScene(card.cat,true);
    }
  },180);
});
fit();
document.body.dataset.screen='scCreate';

/* dev hook */
window.__dev={ get C(){return C;}, get R(){return R;}, choose:choose,
  state:function(){return {round:C.round,pos:R&&R.pos,risk:R&&R.risk,points:C.points,beats:R&&R.beats,screen:activeScreen};},
  clear:function(){clearSave();C=newCareer();},
  preview:function(seed){
    const bs=C.seed, br=C.round, bd=JSON.parse(JSON.stringify(C.decks));
    C.seed=seed; initDecks();
    const out=[];
    for(let r=1;r<=8;r++){
      C.round=r;
      const rnd=mulberry(hash(C.seed+'|round'+r+'|cards'));
      out.push(shuffle(PACK.cats.slice(),rnd).map(function(cat){return drawCard(cat);}));
    }
    C.seed=bs; C.round=br; C.decks=bd;
    return out;
  } };


/* ============ 賽季（narrative 由 pack 提供） ============ */

function renderSeason(final){
  const wide=window.innerWidth>=980;
  $('seasonEyebrow').textContent=L.seasonWord+' '+PACK.meta.season+' · '+PACK.meta.subject+' · '+C.name;
  $('seasonTitle').textContent=final?L.seasonFinal:L.seasonTable;
  let rows='',cum=0;
  for(let i=0;i<C.races;i++){
    const r=C.results[i], cir=PACK.entities.circuits[i];
    if(r){
      cum+=r.pts;
      rows+='<div class="srow'+(r.round===C.round?' me':'')+'"><span>R'+(i+1)+'</span><span>'+cir.s+'</span>'+
        '<span>'+(r.dnf?'—':('P'+r.pos))+'</span><span>'+(r.dnf?'DNF':r.pts)+'</span><span>'+cum+'</span></div>';
    }else{
      rows+='<div class="srow pending"><span>R'+(i+1)+'</span><span>'+cir.s+'</span><span>—</span><span>—</span><span>'+cum+'</span></div>';
    }
  }
  $('seasonRows').innerHTML=rows;

  const board=[{name:C.name,team:PACK.meta.subjectShort||PACK.meta.subject,pts:C.points,me:true}];
  Object.keys(C.rivalPts).forEach(function(k){ board.push({name:k,team:'—',pts:C.rivalPts[k],me:false}); });
  board.sort(function(a,b){return b.pts-a.pts;});
  let st='';
  board.slice(0,12).forEach(function(e,i){
    st+='<div class="crow'+(e.me?' me':'')+'"><span>'+(i+1)+'</span><span class="crow-name">'+e.name+'</span>'+
      '<span class="crow-team">'+e.team+'</span><span>'+e.pts+'</span></div>';
  });
  $('standings').innerHTML=st;

  if(!C.repLog.length){
    $('repLog').innerHTML='<span class="small">'+L.repLogEmpty+'</span>';
  }else{
    $('repLog').innerHTML=C.repLog.slice().reverse().map(function(x){
      return '<div><b>'+(x.d>0?'+':'')+x.d+'</b><em>R'+x.round+'</em>'+x.t+'</div>';
    }).join('');
  }
  paintHud();

  if(final){
    $('resumeRaceBtn').style.display='none';
    const podiums=C.results.filter(function(r){return !r.dnf&&r.pos<=3;}).length;
    const dnfs=C.results.filter(function(r){return r.dnf;}).length;
    const tier=(C.points>=48||(podiums>=2&&C.points>=32))?'A':((C.points>=22||podiums>=1)?'B':'C');
    const n=PACK.narrative.seasonEnd({tier:tier,C:C,podiums:podiums,dnfs:dnfs,style:PACK.archetypes[C.style].label});
    $('seasonEnd').style.display='block';
    $('seasonEnd').innerHTML='<div class="tierBox '+(tier==='A'?'a':(tier==='C'?'c':''))+'">'+
      '<div class="eyebrow">'+n.eyebrow+'</div><h2>'+n.head+'</h2>'+
      '<div class="story">'+n.body+'</div></div>';
    $('newSeasonBtn').textContent=L.newSeason;
    $('newSeasonBtn').style.display='inline-block';
    $('restartBtn').style.display='none';
    $('backBtn').style.display='none';
  }else{
    $('seasonEnd').style.display='none';
    $('resumeRaceBtn').textContent=(R&&R.result)?L.backToResult:L.backToRace2;
    $('resumeRaceBtn').style.display='inline-block';
    $('newSeasonBtn').style.display='none';
    $('restartBtn').style.display='inline-block';
    $('backBtn').style.display='inline-block';
  }
  if(!wide) $('backBtn').style.minHeight='44px';
}

function endSeason(){
  C.done=true; C.race=null; R=null;
  save();
  renderSeason(true);
  show('scSeason');
}


/* ============ 建立頁（由 pack.create 生成） ============ */

function renderCreate(){
  const c=PACK.create;
  document.title=PACK.meta.title+' — '+PACK.meta.subject;
  const brand=document.querySelector('#scCreate .brand');
  if(brand) brand.innerHTML='<i></i> '+L.brand+' <span>'+L.brandSub+'</span>';
  const eb=$('createEyebrow'); if(eb) eb.textContent=c.eyebrow;
  const h=$('createHeadline'); if(h) h.innerHTML=c.headline.join('<br>');
  const lede=$('createLede'); if(lede) lede.textContent=c.lede;
  const nl=$('labelName'); if(nl) nl.textContent=c.nameLabel;
  const sl=$('labelStyle'); if(sl) sl.textContent=c.styleLabel;
  const tl=$('labelTeam'); if(tl) tl.textContent=c.teamLabel;
  const tv=$('teamValue'); if(tv) tv.textContent=c.teamValue;
  const ni=$('nameIn'); if(ni) ni.value=c.defaultName;
  const st=$('styles');
  if(st){
    st.innerHTML=Object.keys(PACK.archetypes).map(function(k,i){
      const a=PACK.archetypes[k];
      return '<div class="opt'+(i===0?' sel':'')+'" data-s="'+k+'"><b>'+a.label+'</b><span>'+a.note+'</span></div>';
    }).join('');
    st.querySelectorAll('.opt').forEach(function(o){
      o.onclick=function(){
        st.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        o.classList.add('sel');
      };
    });
  }
  const sb=$('startBtn'); if(sb) sb.textContent=c.cta;
  const rw=$('radioWho'); if(rw) rw.textContent=c.radioWho;
  const rf=$('radio'); if(rf) rf.textContent=c.radioFirst;
  const hu=$('hudBrand');
  if(hu) hu.innerHTML='<i></i> '+L.brand+' <span id="hudRace">'+L.roundWord+' 1 · '+PACK.meta.rounds+'</span>';
}

/* 靜態 label 由 data-l 注入 */
function injectLabels(){
  document.querySelectorAll('[data-l]').forEach(function(el){
    const k=el.dataset.l;
    if(L[k]!=null) el.textContent=L[k];
  });
}

/* ============ 事件綁定（renderCreate 之後） ============ */
function bindEvents(){
  $('startBtn').onclick=function(){
    if(hasSave && !C.done && C.results.length>0){ clearSave(); hasSave=false; }
    startCareer();
  };
  $('continueBtn').onclick=function(){ resume(); };
  $('nextBtn').onclick=function(){
    if(!R||!R.result) return;
    if(C.round<C.races){ C.round++; C.race=null; R=null; save(); startRace(); }
    else { endSeason(); }
  };
  $('tableBtn').onclick=function(){ renderSeason(false); show('scSeason'); };
  $('tableBtn2').onclick=function(){ renderSeason(false); show('scSeason'); };
}

renderCreate();
bindEvents();
injectLabels();

/* 開機 */
boot();

</script>
