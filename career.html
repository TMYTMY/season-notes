<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Career Notes</title>
<style>
:root{
  --ink:#0e1218; --paper:#f4f1e8; --card:#161c26; --card2:#1d2532; --cardlift:#232c3b;
  --line:#2b3546; --line2:#3a465b; --slate:#a8b0be; --muted:#7d8798;
  --gold:#f2c14e; --gold2:#d8a63a; --red:#c8402f; --green:#4f9a72; --blue:#5b86c9;
  --fs-12:12px; --fs-14:14px; --fs-16:16px; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 90% at 20% 0%,#1a2230 0%,var(--ink) 55%) fixed;
  color:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:var(--fs-16); line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 40px}
header.hud{
  position:sticky;top:0;z-index:10;background:rgba(14,18,24,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:8px 18px;
}
.hudrow{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:var(--fs-12);letter-spacing:.22em;color:var(--slate);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;background:var(--gold);display:block;transform:rotate(45deg)}
.age{margin-left:auto;font-variant-numeric:tabular-nums;font-size:var(--fs-14);color:var(--gold)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:var(--fs-12);color:var(--slate);white-space:nowrap}
.stat b{color:var(--paper);font-variant-numeric:tabular-nums;margin-left:5px;font-weight:600}
.stat.hot b{color:var(--red)}
.stat.money b{color:var(--gold)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold);width:0}
section{display:none;padding-top:26px}
section.on{display:block}
h1{font-size:26px;line-height:1.25;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.3;margin:0 0 10px}
p{color:var(--slate);margin:0 0 14px}
.kicker{font-size:var(--fs-12);letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);margin-bottom:10px}
.card{background:linear-gradient(160deg,var(--cardlift),var(--card2));border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:var(--r);padding:16px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);text-align:left}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.opt{display:flex;align-items:center;gap:10px;padding:13px 14px;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold2);background:var(--cardlift)}
.opt .lab{flex:1}
.opt .lab small{display:block;color:var(--muted);font-size:var(--fs-12);line-height:1.45;margin-top:3px}
.opt .tag{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.btn{display:inline-block;padding:13px 20px;min-height:48px;background:var(--gold);color:#171307;border:none;border-radius:var(--r);font-weight:600;text-align:center}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line2)}
.btn:disabled{opacity:.4;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.alloc{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.arow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:56px}
.arow .an{flex:1}
.arow .an small{display:block;color:var(--muted);font-size:var(--fs-12)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card2);border:1px solid var(--line2);border-radius:9px;color:var(--paper);text-align:center}
.step .n{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold)}
.left{color:var(--slate);font-size:var(--fs-14)}
.left b{color:var(--gold);font-variant-numeric:tabular-nums}
.log{border-top:1px solid var(--line);margin-top:20px;padding-top:12px}
.log div{font-size:var(--fs-14);color:var(--slate);padding:5px 0;border-bottom:1px dashed rgba(58,70,91,.5)}
.log div span{color:var(--muted);font-size:var(--fs-12);margin-right:8px}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;margin-right:6px}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:var(--fs-14)}
td{padding:6px 4px;border-bottom:1px solid var(--line);color:var(--slate)}
td:last-child{text-align:right;color:var(--paper);font-variant-numeric:tabular-nums}
.seed{font-size:var(--fs-12);color:var(--muted);margin-top:10px}
@media (max-width:520px){
  h1{font-size:22px}
  h2{font-size:18px}
  .wrap{padding:0 14px 32px}
  header.hud{padding:7px 14px}
  .opt{padding:12px;min-height:60px}
  .btn{width:100%}
  .btnrow{gap:8px}
  .stat{font-size:11px;padding:2px 7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hud">
  <div class="hudrow">
    <div class="brand"><i></i> CAREER NOTES</div>
    <div class="age" id="hAge">14 歲</div>
  </div>
  <div class="hudrow">
    <div class="stats" id="hStats"></div>
  </div>
  <div class="hudrow"><div class="bar"><i id="hBar"></i></div></div>
</header>

<div class="wrap">
  <section id="scIntro" class="on">
    <div class="kicker">第一章 · 14–20</div>
    <h1>你唔會落場揸車。<br>你只會決定自己變成邊種車手。</h1>
    <p>14 歲到 20 歲，七年、二十六個決定。每年十點時間，永遠唔夠分。</p>
    <div class="card">
      <h2>由 14 歲開始</h2>
      <p style="margin:0">每次決定都會留低嘢：屬性、現金、名聲、HEAT、同三個人對你嘅睇法。</p>
      <div class="btnrow">
        <button class="btn" id="btnStart">開始</button>
        <button class="btn ghost" id="btnResume" hidden>繼續上一局</button>
      </div>
      <div class="seed" id="seedLine"></div>
    </div>
  </section>

  <section id="scAlloc">
    <div class="kicker" id="allocKicker">14 歲 · 時間分配</div>
    <h2>今年十點時間，你點分？</h2>
    <p id="allocHint">一定要放棄一樣 —— 呢個係第一個三難。</p>
    <div class="left">剩餘 <b id="leftPts">10</b> 點</div>
    <div class="alloc" id="allocList"></div>
    <div class="btnrow"><button class="btn" id="btnAlloc" disabled>確認分配</button></div>
  </section>

  <section id="scCard">
    <div class="kicker" id="cardKicker">14 歲</div>
    <h2 id="cardTitle">——</h2>
    <p id="cardPremise">——</p>
    <div class="opts" id="cardOpts"></div>
    <div class="log" id="cardLog"></div>
  </section>

  <section id="scDoor">
    <div class="kicker">17 歲尾</div>
    <h2>門唔係揀，係開</h2>
    <p id="doorWhy">——</p>
    <div class="opts" id="doorOpts"></div>
  </section>

  <section id="scEnd">
    <div class="kicker" id="endKicker">20 歲 · 第一章結算</div>
    <h1 id="endTitle">——</h1>
    <p id="endBody">——</p>
    <div class="card"><table id="endTable"></table></div>
    <div class="btnrow">
      <button class="btn" id="btnAgain">再玩一局</button>
      <button class="btn ghost" id="btnReview">睇返呢七年</button>
    </div>
    <div class="log" id="endLog"></div>
  </section>
</div>

const S={};
let alloc=Array(ACTS.length).fill(0);

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t}return b}
function der(){return{spd:Math.round((S.a.rea+S.a.feel)/2),stb:Math.round((S.a.men+S.a.disc+S.a.feel)/3),atk:Math.round((S.a.drv+S.a.nerve)/2),sta:S.a.sta}}
function newState(){
  return {v:3,year:14,bi:0,beats:[],used:[],a:Object.assign({},START),cash:12,fame:0,heat:0,respect:0,
   rel:{mentor:50,family:60,rival:30},route:null,vals:{trust:0,matey:0,gang:0},licence:null,
   door:null,doors:[],shame:0,inj:0,transferUsed:false,log:[],over:false,prep:0,gear:null,qok:0,
   flags:{f3:false,f4Seat:false,debt:0,arrested:false},resolved20:null};
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE);if(!r)return false;const o=JSON.parse(r);if(!o||o.v!==3)return false;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,o);return true}catch(e){return false}}
function wipe(){try{localStorage.removeItem(SAVE)}catch(e){}}

function show(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function paintHud(){
  const d=der();
  $('hAge').textContent=S.year+' 歲';
  $('hStats').innerHTML=
   '<span class="stat">速度<b>'+d.spd+'</b></span>'+
   '<span class="stat">穩定<b>'+d.stb+'</b></span>'+
   '<span class="stat">攻擊<b>'+d.atk+'</b></span>'+
   '<span class="stat">續航<b>'+d.sta+'</b></span>'+
   '<span class="stat money">CASH<b>'+S.cash.toFixed(1)+' 萬</b></span>'+
   '<span class="stat">FAME<b>'+S.fame+'</b></span>'+
   '<span class="stat'+(S.heat>=40?' hot':'')+'">HEAT<b>'+S.heat+'</b></span>';
  $('hBar').style.width=Math.min(100,S.heat)+'%';
}
function logit(txt){S.log.push('['+S.year+' 歲] '+txt)}
function applyFx(fx){
  if(!fx)return;
  ATTRS.forEach(k=>{if(typeof fx[k]==='number')S.a[k]=clamp(S.a[k]+fx[k],0,100)});
  if(fx.cash)S.cash=Math.max(0,S.cash+fx.cash);
  if(fx.fame)S.fame=clamp(S.fame+fx.fame,0,100);
  if(fx.heat)S.heat=clamp(S.heat+fx.heat,0,100);
  if(fx.respect)S.respect=clamp(S.respect+fx.respect,0,100);
  if(fx.rel)Object.keys(fx.rel).forEach(k=>{S.rel[k]=clamp(S.rel[k]+fx.rel[k],0,100)});
  if(fx.route)Object.keys(fx.route).forEach(k=>{S.vals[k]=clamp(S.vals[k]+fx.route[k],0,100)});
  if(fx.inj){S.inj+=fx.inj;S.a.nerve=clamp(S.a.nerve-5,0,100);S.a.rea=clamp(S.a.rea-8,0,100)}
}

function startRun(){
  Object.assign(S,newState());
  if(location.search.indexOf('door=')>=0){
    const forced=(location.search.match(/door=(\w+)/)||[])[1];
    if(forced)S.forced=forced;
  }
  wipe();save();beginYear();
}
function beginYear(){
  const y=S.year;S.bi=0;S.beats=[];
  S.prep=0;S.gear=null;S.qok=0;
  if(y<=17){
    S.beats.push({k:'alloc'});
    let pool=shuf(CARDS.filter(c=>c.y===y&&S.used.indexOf(c.id)<0));
    for(let i=0;i<pool.length&&i<4;i++){S.used.push(pool[i].id);S.beats.push({k:'card',card:pool[i]})}
    while(S.beats.length<5){const c=pick(CARDS.filter(function(x){return x.y===y}));S.beats.push({k:'card',card:c})}
  }else if(y===18){
    EXAM.forEach(c=>S.beats.push({k:'card',card:c}));
    S.beats.push({k:'gear'});
    S.beats.push({k:'exam'});
    S.beats.push({k:'examres'});
  }else if(y===19){
    const r=S.door||S.forced||'f4';
    const e=ENTRY[r];
    S.beats.push({k:'card',card:Object.assign({id:'entry'},e,{t:e.t,p:e.p})});
    shuf(ROUTE19[r]||ROUTE19.f4).slice(0,2).forEach(c=>S.beats.push({k:'card',card:c}));
  }else{
    const r=S.door||S.forced||'f4';
    S.beats.push({k:'card',card:Object.assign({id:'r20a'},ROUTE20[r]||ROUTE20.f4)});
    shuf(ROUTE20B[r]||ROUTE20B.f4).slice(0,2).forEach(c=>S.beats.push({k:'card',card:c}));
    S.beats.push({k:'settle'});
  }
  save();nextBeat();
}
function nextBeat(){
  paintHud();
  if(S.bi>=S.beats.length){
    if(S.year===17){toDoors();return}
    if(S.year>=20){settle20();return}
    S.year++;beginYear();return;
  }
  const b=S.beats[S.bi];
  if(b.k==='alloc'){renderAlloc();return}
  if(b.k==='card'){renderCard(b.card);return}
  if(b.k==='gear'){renderGear();return}
  if(b.k==='exam'){
    if(S.gear!=='manual'){S.bi++;nextBeat();return}
    renderExam();return
  }
  if(b.k==='examres'){renderExamRes();return}
  if(b.k==='settle'){settle20();return}
}
function renderAlloc(){
  show('#scAlloc');
  alloc=Array(ACTS.length).fill(0);
  $('allocKicker').textContent=S.year+' 歲 · 時間分配';
  $('allocHint').textContent='每年十點。一定要放棄一樣。';
  const box=$('allocList');box.innerHTML='';
  ACTS.forEach(function(act,i){
    const row=document.createElement('div');row.className='arow';
    row.innerHTML='<div class="an">'+act.n+'<small>'+act.d+'</small></div>'+
      '<div class="step"><button data-i="'+i+'" data-d="-1">−</button><span class="n" id="n'+i+'">0</span><button data-i="'+i+'" data-d="1">+</button></div>';
    box.appendChild(row);
  });
  box.querySelectorAll('button').forEach(function(btn){
    btn.onclick=function(){
      const i=+btn.dataset.i,d=+btn.dataset.d;
      const used=alloc.reduce((a,b)=>a+b,0);
      if(d>0&&used>=10)return;
      if(d<0&&alloc[i]<=0)return;
      alloc[i]+=d;
      $('n'+i).textContent=alloc[i];
      $('leftPts').textContent=10-alloc.reduce((a,b)=>a+b,0);
      $('btnAlloc').disabled=alloc.reduce((a,b)=>a+b,0)!==10;
    };
  });
  $('leftPts').textContent='10';
  $('btnAlloc').disabled=true;
  $('btnAlloc').onclick=function(){
    ACTS.forEach(function(act,i){
      for(let n=0;n<alloc[i];n++){
        if(act.k==='train'){S.a.rea=clamp(S.a.rea+1,0,100);S.a.feel=clamp(S.a.feel+1,0,100)}
        if(act.k==='wrench'){S.a.feel=clamp(S.a.feel+1,0,100);S.a.disc=clamp(S.a.disc+1,0,100)}
        if(act.k==='study'){S.rel.family=clamp(S.rel.family+7,0,100)}
        if(act.k==='work'){S.cash=Math.round((S.cash+1.5)*10)/10}
        if(act.k==='race'){S.a.drv=clamp(S.a.drv+1,0,100);S.fame=clamp(S.fame+5,0,100);S.heat=clamp(S.heat+4,0,100)}
        if(act.k==='people'){
          const low=Object.keys(S.rel).sort(function(a,b){return S.rel[a]-S.rel[b]})[0];
          S.rel[low]=clamp(S.rel[low]+9,0,100);S.a.men=clamp(S.a.men+1,0,100);
        }
      }
    });
    logit('時間分配：'+ACTS.map(function(a,i){return a.n+' '+alloc[i]}).filter(function(x){return !/ 0$/.test(x)}).join('、'));
    S.bi++;save();nextBeat();
  };
}
function renderCard(card){
  show('#scCard');
  $('cardKicker').textContent=S.year+' 歲 · '+String(S.bi===0?1:S.bi)+' / '+S.beats.length;
  $('cardTitle').textContent=card.t;
  $('cardPremise').textContent=card.p;
  const box=$('cardOpts');box.innerHTML='';
  card.o.forEach(function(o,i){
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<div class="lab">'+o.t+'<small>'+o.s+'</small></div>';
    btn.onclick=function(){
      applyFx(o.fx);
      if(o.prep)S.prep+=o.prep;
      if(o.gear){S.gear=o.gear;S.licence=o.gear==='auto'?'auto':null}
      if(o.gamble){
        if(Math.random()<0.45){S.cash+=18;logit('賭贏：現金 +18 萬');S.fame=clamp(S.fame+10,0,100)}
        else{S.cash=Math.max(0,S.cash-6);S.heat=clamp(S.heat+14,0,100);S.flags.debt+=8;logit('賭輸：欠債增加')}
      }
      logit(o.l);
      paintHud();save();
      S.bi++;nextBeat();
    };
    box.appendChild(btn);
  });
  renderLog();
}
function renderLog(){
  const box=$('cardLog');box.innerHTML='';
  S.log.slice(-4).forEach(function(t){const d=document.createElement('div');d.textContent=t;box.appendChild(d)});
}
function renderGear(){
  show('#scCard');
  $('cardKicker').textContent='18 歲 · 考車';
  $('cardTitle').textContent=GEAR.t;
  $('cardPremise').textContent=GEAR.p;
  const box=$('cardOpts');box.innerHTML='';
  GEAR.o.forEach(function(o){
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<div class="lab">'+o.t+'<small>'+o.s+'</small></div>';
    btn.onclick=function(){
      S.gear=o.gear;S.licence=o.gear==='auto'?'auto':null;
      logit(o.l);save();S.bi++;nextBeat();
    };
    box.appendChild(btn);
  });
  renderLog();
}
function renderExam(){
  show('#scCard');
  $('cardKicker').textContent='18 歲 · 考車 · 棍波真題';
  const idx=S.qok;
  const q=QS[idx];
  $('cardTitle').textContent='第 '+(idx+1)+' / 3 題';
  $('cardPremise').textContent=q.t;
  const box=$('cardOpts');box.innerHTML='';
  const order=shuf(q.a);
  order.forEach(function(a){
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<div class="lab">'+a.t+'</div>';
    btn.onclick=function(){
      S.qok++;
      if(!a.ok)S.wrong=(S.wrong||0)+1;
      const d=document.createElement('div');d.textContent=(a.ok?'啱。':'錯。')+q.e;
      S.log.push('[18 歲] '+d.textContent);
      save();
      if(S.qok>=3){S.bi++;nextBeat()}else{renderExam()}
    };
    box.appendChild(btn);
  });
  renderLog();
}
function renderExamRes(){
  const d=der();
  let p=55+d.stb*0.25+S.a.feel*0.15-S.heat*0.30+S.prep;
  p+=(S.gear==='manual')?-10:15;
  if(S.gear==='manual'){
    const w=S.wrong||0;
    if(w===0){p+=10;S.a.feel=clamp(S.a.feel+6,0,100);S.respect=clamp(S.respect+8,0,100)}
    else if(w===1){p-=15;S.gear='auto';S.licence='auto';S.shame=1}
  }
  p=clamp(p,5,95);
  const pass=Math.random()*100<p;
  show('#scCard');
  $('cardKicker').textContent='18 歲 · 路試結果';
  if(pass){
    S.licence=S.gear;
    $('cardTitle').textContent='合格';
    $('cardPremise').textContent='考官簽紙。你手上有一張正式牌照（'+(S.gear==='manual'?'棍波':'自動波')+'）。合格率推算 '+Math.round(p)+'%。';
    const box=$('cardOpts');box.innerHTML='';
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<div class="lab">繼續</div>';
    btn.onclick=function(){logit('考車合格（'+S.gear+'）');save();S.bi++;nextBeat()};
    box.appendChild(btn);
  }else{
    spawnFail();
  }
  renderLog();
}
function spawnFail(){
  $('cardTitle').textContent='肥佬';
  $('cardPremise').textContent='考官話你「控制唔穩定」。你可以再考、買牌，或者放棄。';
  const box=$('cardOpts');box.innerHTML='';
  const opts=[
   {t:'再考一次',s:'四萬，準備再升',fx:{cash:-4,men:2},l:'你報咗下一次。'},
   {t:'走後門買牌',s:'十五萬，HEAT 爆升',fx:{cash:-15,heat:15,disc:-6},l:'你買咗一張。有人知。'},
   {t:'放棄考牌',s:'這條路收咗',fx:{drv:-6},l:'你把筆記掉咗。'}
  ];
  opts.forEach(function(o){
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<div class="lab">'+o.t+'<small>'+o.s+'</small></div>';
    btn.onclick=function(){
      applyFx(o.fx);logit(o.l);
      if(o.t==='再考一次'){S.prep+=8;renderExamRes();return}
      if(o.t==='走後門買牌'){S.licence='auto';S.shame=1;S.bi++;nextBeat();return}
      S.over=true;save();ending('你冇再考牌。七年之後，你仲係喺車房做學徒。');
    };
    box.appendChild(btn);
  });
}
function toDoors(){
  const d=der();
  let open=[];
  if((d.spd>=60||d.stb>=70)&&(S.cash>=30||S.fame>=40)&&S.rel.family>=50)open.push('f4');
  if((S.a.feel>=55||S.a.nerve>=65)&&S.rel.mentor>=60)open.push('rally');
  if(S.heat>=40||S.fame>=50)open.push('street');
  if(S.forced)open=[S.forced];
  if(!open.length){
    const score={f4:(d.spd+d.stb)/2,rally:(S.a.feel+S.a.nerve)/2,street:(S.heat+S.fame)/2};
    open.push(Object.keys(score).sort(function(a,b){return score[b]-score[a]})[0]);
  }
  S.doors=open;save();
  show('#scDoor');
  const names={f4:'F4 正規軍',rally:'Rally',street:'街頭'};
  $('doorWhy').textContent='速度 '+d.spd+'／穩定 '+d.stb+'／車感 '+S.a.feel+'／膽量 '+S.a.nerve+'／HEAT '+S.heat+'／FAME '+S.fame+'／家人 '+S.rel.family+'／師傅 '+S.rel.mentor;
  const box=$('doorOpts');box.innerHTML='';
  open.forEach(function(r){
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML='<div class="lab">'+names[r]+'<small>門開咗，你可以行入去</small></div>';
    btn.onclick=function(){
      S.door=r;S.year=18;logit('揀咗'+names[r]);
      if(r==='rally'){S.a.feel=clamp(S.a.feel+4,0,100)}
      if(r==='street'){S.heat=clamp(S.heat+6,0,100)}
      save();beginYear();
    };
    box.appendChild(btn);
  });
}
function settle20(){
  const d=der(),r=S.door||S.forced||'f4';
  let headline='';
  if(r==='f4'){
    if(S.vals.trust>=65&&d.stb>=70){S.flags.f3=true;headline='車隊信任 '+S.vals.trust+'、穩定 '+d.stb+' —— 你升上 F3。'}
    else if(S.vals.trust<40){S.vals.trust=Math.max(0,S.vals.trust);headline='車隊信任只有 '+S.vals.trust+' —— 你冇位。轉線機會仲喺。';S.flags.f4Seat=false}
    else{headline='車隊信任 '+S.vals.trust+'、穩定 '+d.stb+' —— 未夠，留 F4 多一年。';S.flags.f4Seat=true}
  }else if(r==='rally'){
    const comp=S.a.feel*0.35+S.vals.matey*0.30+S.a.sta*0.20+S.a.nerve*0.15-10;
    if(comp<45){S.inj+=1;S.a.rea=clamp(S.a.rea-8,0,100);S.a.nerve=clamp(S.a.nerve-5,0,100);headline='賽段完成率推算 '+Math.round(comp)+'% —— 你撞咗。傷患 1。'}
    else headline='賽段完成率推算 '+Math.round(comp)+'% —— 你完成咗。';
  }else{
    if(S.heat>=80){S.flags.arrested=true;headline='HEAT '+S.heat+' —— 你被拉。'}
    else if(S.heat>=60){S.vals.gang=Math.max(0,S.vals.gang-30);S.cash=Math.max(0,S.cash-10);headline='HEAT '+S.heat+' —— 朋友出賣你。錢同幫會關係冇咗。'}
    else if(S.heat>=40){headline='HEAT '+S.heat+' —— 警方上門問話。你收手，HEAT −20。';S.heat=Math.max(0,S.heat-20)}
    else headline='HEAT '+S.heat+' —— 你行得通。';
  }
  S.resolved20=headline;S.over=true;save();
  if(S.flags.arrested){ending('你 20 歲，有案底。');return}
  if(S.inj>=2){ending('你 20 歲，身體已經唔許可你繼續。');return}
  const top=ATTRS.slice().sort(function(a,b){return S.a[b]-S.a[a]});
  const rows=[
   ['最強',L[top[0]]+' '+S.a[top[0]]+'、'+L[top[1]]+' '+S.a[top[1]]+'、'+L[top[2]]+' '+S.a[top[2]]],
   ['最弱',L[top[6]]+' '+S.a[top[6]]],
   ['速度／穩定',d.spd+' ／ '+d.stb],
   ['路線',({f4:'F4',rally:'Rally',street:'街頭'})[r]],
   ['牌照',S.licence==='manual'?'棍波':(S.licence==='auto'?'自動波':'未考到')],
   ['宿敵',S.rel.rival>=50?'同你平手，仲喺你附近':'已經升咗上去，唔再等你'],
   ['未了事',(S.flags.debt>0?'欠債 '+S.flags.debt+' 萬；':'')+(S.shame?'有人仲笑你唔識棍波':'冇')],
   ['帶入下一章',(S.flags.f3?'F3 席位':(S.flags.f4Seat?'F4 席位未穩':'未有席位'))+(S.transferUsed?'':'、轉線機會未用')]
  ];
  $('endTitle').textContent=S.year+' 歲 · '+(S.flags.f3?'你升咗上去':(r==='street'?'你仲行得':(r==='rally'?'你完成咗':'你仲喺原位')));
  $('endBody').textContent=headline;
  $('endTable').innerHTML=rows.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>'}).join('');
  show('#scEnd');
  $('endLog').innerHTML='';
  S.log.forEach(function(t){const d2=document.createElement('div');d2.textContent=t;$('endLog').appendChild(d2)});
}
function ending(msg){
  $('endTitle').textContent='結局';
  $('endBody').textContent=msg;
  $('endTable').innerHTML='<tr><td>年齡</td><td>'+S.year+' 歲</td></tr><tr><td>HEAT</td><td>'+S.heat+'</td></tr><tr><td>傷患</td><td>'+S.inj+'</td></tr>';
  show('#scEnd');
  $('endLog').innerHTML='';
  S.log.forEach(function(t){const d2=document.createElement('div');d2.textContent=t;$('endLog').appendChild(d2)});
}

$('btnStart').onclick=function(){startRun()};
$('btnAgain').onclick=function(){wipe();Object.assign(S,newState());$('btnResume').hidden=true;show('#scIntro')};
$('btnReview').onclick=function(){show('#scEnd')};
$('btnResume').onclick=function(){nextBeat()};

(function boot(){
  Object.assign(S,newState());
  paintHud();
  if(load()){
    $('btnResume').hidden=false;
    $('seedLine').textContent='有一局未完成：'+S.year+' 歲，已經行咗 '+S.log.length+' 個決定。';
    if(S.over){$('btnResume').hidden=true}
  }else{
    $('seedLine').textContent='離線可玩 · 單檔 · 冇 seed，每局都唔同';
  }
})();
</script>
</body>
</html>
